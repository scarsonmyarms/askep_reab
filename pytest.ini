[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not regression"
markers =
    real: тести на реальному довіднику (потрібен файл, див. tests/conftest.py)
    gui: тести графічного інтерфейсу (потрібні tkinter і дисплей)
    regression: регресія на справжніх вердиктах НСЗУ (запуск окремо: pytest -m regression)
